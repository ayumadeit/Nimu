name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nimu
          POSTGRES_PASSWORD: nimupassword
          POSTGRES_DB: nimu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Run Prisma generate
        run: npm run prisma:generate --workspace=@nimu/api
        env:
          DATABASE_URL: "postgresql://nimu:nimupassword@localhost:5432/nimu_test?schema=public"

      - name: Run Prisma migrations
        run: npm run prisma:push --workspace=@nimu/api
        env:
          DATABASE_URL: "postgresql://nimu:nimupassword@localhost:5432/nimu_test?schema=public"

      - name: Run unit & integration tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://nimu:nimupassword@localhost:5432/nimu_test?schema=public"
          JWT_ACCESS_SECRET: "test_jwt_access_secret_super_secure_key_32_chars"
          JWT_REFRESH_SECRET: "test_jwt_refresh_secret_super_secure_key_32_chars"

      - name: Build all packages
        run: npm run build
