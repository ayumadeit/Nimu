services:
  # Fastify API Web Service
  - type: web
    name: nimu-api
    env: node
    plan: standard
    buildCommand: npm ci && npm run build:shared && npm run build:api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nimu-postgres
          property: connectionString
      - key: APP_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Vite Frontend Static Site
  - type: web
    name: nimu-web
    env: static
    buildCommand: npm ci && npm run build:shared && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nimu-api
          property: host

databases:
  - name: nimu-postgres
    plan: standard
    postgresMajorVersion: 16
