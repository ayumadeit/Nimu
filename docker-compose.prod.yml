version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nimu-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimusecurepass2026}
      POSTGRES_DB: ${POSTGRES_DB:-nimu_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimu} -d ${POSTGRES_DB:-nimu_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nimu-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nimu-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nimu}:${POSTGRES_PASSWORD:-nimusecurepass2026}@postgres:5432/${POSTGRES_DB:-nimu_prod}?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-nimu_super_secret_access_jwt_key_prod_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-nimu_super_secret_refresh_jwt_key_prod_32chars}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nimu-prod-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_prod_data:
  redis_prod_data:
